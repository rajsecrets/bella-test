app:
  name: bella-chainlit-app
  regions:
    - fra

services:
  - name: bella-service
    ports:
      - port: 8000
        http:
          paths:
            - /
    env:
      - name: GEMINI_API_KEY
        value: your_gemini_api_key
      - name: SERP_API_KEY
        value: your_serp_api_key
    docker:
      image: koyeb/bella-chainlit-app